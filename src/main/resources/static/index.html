<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Reminder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/beer.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="responsive app">
    <h1 class="small">Reminder</h1>

    <article id="error-span" class="error-container" role="alert" style="display: none"></article>

    <div class="stats">
        <div id="remaining-words-count-to-learn-span" class="chip"></div>
        <div id="remaining-words-count-to-confirm-span" class="chip"></div>
    </div>

    <article class="border word-block">
        <small class="field-label">Mot</small>
        <span id="word-to-learn-span"></span>
    </article>

    <div class="row middle-align">
        <div class="field border max">
            <input id="translation-input" type="text" aria-label="Traduction" placeholder="Entrez la traduction…"
                   autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"/>
        </div>
        <button id="submit-button">Valider</button>
    </div>

    <article id="result-feedback" class="border" style="visibility: hidden">
        <small class="field-label">Traduction</small>
        <span id="real-translation-span"></span>
        <span id="learned-badge" class="chip small primary" style="display: none">appris !</span>
    </article>

    <button id="next-button" class="border">Suivant</button>
</main>
<script type="module" src="/js/main.js"></script>
</body>
</html>
