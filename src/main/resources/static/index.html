<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" name="viewport">
    <title>Reminder</title>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="/vendor/beer.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
e
<main class="responsive large-width top-padding">
    <nav class="wrap">
        <h1 class="h6">Reminder</h1>
        <div class="max"></div>
        <div class="chip small no-border">
            <span id="remaining-words-count-to-learn-span"></span>
            ·
            <span id="remaining-words-count-to-confirm-span"></span>
        </div>
    </nav>

    <article aria-atomic="true" aria-live="assertive" class="error-container" id="error-span"
             style="display: none"></article>

    <article class="border">
        <h5 id="word-to-learn-span"></h5>
    </article>

    <div class="field large border">
        <input aria-label="Traduction" autocapitalize="off" autocomplete="off"
               enterkeyhint="done" id="translation-input" placeholder="Entrez la traduction…" spellcheck="false"
               type="text"/>
    </div>

    <article class="border" id="result-feedback" style="visibility: hidden">
        <nav>
            <span aria-label="Résultat" class="feedback-icon" role="img"></span>
            <h5 class="max" id="real-translation-span"></h5>
            <span class="chip small primary no-border" id="learned-badge" style="display: none">appris !</span>
        </nav>
    </article>
</main>

<!-- Beer's page grid pins this footer to the bottom; .fixed makes it sticky, in thumb reach on a phone -->
<footer class="fixed responsive large-width">
    <button class="responsive large" id="submit-button">Valider</button>
    <button class="responsive large" hidden id="next-button">Suivant</button>
</footer>
<script src="/js/main.js" type="module"></script>
</body>
</html>
